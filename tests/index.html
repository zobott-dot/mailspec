<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MailSpec Test Suite</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0f172a; color: #e2e8f0; padding: 2rem; font-size: 14px; line-height: 1.6; }
        h1 { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; color: #f8fafc; }
        h2 { font-size: 1.1rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; font-weight: bold; }
        .summary { margin-top: 2rem; padding: 1rem; border: 2px solid #334155; border-radius: 8px; font-size: 1.1rem; }
        .summary.all-pass { border-color: #4ade80; }
        .summary.has-fail { border-color: #f87171; }
        .detail { color: #64748b; font-size: 12px; margin-left: 2rem; }
    </style>
</head>
<body>
    <h1>MailSpec Test Suite</h1>
    <div id="version"></div>
    <div id="output"></div>
    <div id="summary"></div>

    <!-- Load app data and utility modules -->
    <script src="../app/data/stocks.js"></script>
    <script src="../app/data/coatings.js"></script>
    <script src="../app/data/seals.js"></script>
    <script src="../app/data/postage.js"></script>
    <script src="../app/utils/calculations.js"></script>
    <script src="../app/utils/postal.js"></script>
    <script src="../app/utils/compliance.js"></script>

    <script>
        const Calc = window.MailSpec.Calculations;
        const Postal = window.MailSpec.Postal;
        const Compliance = window.MailSpec.Compliance;
        const STOCKS = window.MailSpec.STOCKS;

        let totalTests = 0;
        let passCount = 0;
        let failCount = 0;
        let output = '';

        function section(title) {
            output += `<h2>${title}</h2>`;
        }

        function assert(description, actual, expected, tolerance) {
            totalTests++;
            const tol = tolerance || 0.0005;
            const passed = Math.abs(actual - expected) < tol;
            if (passed) {
                passCount++;
                output += `<div class="pass">[PASS] ${description}</div>`;
            } else {
                failCount++;
                output += `<div class="fail">[FAIL] ${description}</div>`;
                output += `<div class="detail">Expected: ${expected}, Got: ${actual}, Diff: ${(actual - expected).toFixed(6)}</div>`;
            }
        }

        function assertString(description, actual, expected) {
            totalTests++;
            if (actual === expected) {
                passCount++;
                output += `<div class="pass">[PASS] ${description}</div>`;
            } else {
                failCount++;
                output += `<div class="fail">[FAIL] ${description}</div>`;
                output += `<div class="detail">Expected: "${expected}", Got: "${actual}"</div>`;
            }
        }

        // Helper: find stock index by name
        function stockIdx(name) {
            return STOCKS.findIndex(s => s.name === name);
        }

        // Helper: build a minimal component object
        function makeComponent(overrides) {
            const defaults = {
                type: 'sheet', w: 8.5, h: 11, fold: '1', panels: 8,
                foldAxis: 'h', stockIdx: 0, coverStockIdx: -1, binding: 'stitch',
                coating: 'none', manualWeight: null, manualThick: null,
                customPanels: false, flatWidth: null, flatHeight: null,
                finishedWidth: null, finishedHeight: null, layersAtFold: null,
                caliper: 0, gsm: 0
            };
            const comp = Object.assign(defaults, overrides);
            if (comp.caliper === 0 && STOCKS[comp.stockIdx]) {
                comp.caliper = STOCKS[comp.stockIdx].cal;
                comp.gsm = STOCKS[comp.stockIdx].gsm;
            }
            return comp;
        }

        // =====================================================
        // CALCULATION TESTS
        // =====================================================
        section('Calculations: Envelope');

        (function() {
            // #10 Envelope on 24# White Wove: 9.5 x 4.125, cal=0.0040, gsm=90
            var idx = stockIdx('24# White Wove Envelope');
            var c = makeComponent({ type: 'envelope', w: 9.5, h: 4.125, stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            // Weight: (9.5 * 4.125 * 2.1 / 1550.0031) * 90 * 0.035274
            var expectedArea = 9.5 * 4.125 * 2.1;
            var expectedWeight = (expectedArea / 1550.0031) * 90 * 0.035274;
            assert('Envelope weight: #10 on 24# White Wove', m.weightOz, expectedWeight);

            // Thickness: 0.0040 * 2 * 1.1
            assert('Envelope thickness: #10 on 24# White Wove', m.itemThick, 0.0040 * 2 * 1.1);

            // Finished dimensions same as input (no folding)
            assert('Envelope finW unchanged', m.finW, 9.5);
            assert('Envelope finH unchanged', m.finH, 4.125);
        })();

        section('Calculations: Sheet/Self-Mailer (standard folds)');

        (function() {
            // Letter tri-fold: 8.5 x 11, fold=3, foldAxis=h, Cougar 60# Text (cal=0.0046, gsm=89)
            var idx = stockIdx('Domtar Cougar 60# Text');
            var c = makeComponent({ type: 'sheet', w: 8.5, h: 11, fold: '3', foldAxis: 'h', stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            assert('Tri-fold finH: 11/3', m.finH, 11 / 3, 0.001);
            assert('Tri-fold finW unchanged', m.finW, 8.5);

            var expectedWeight = (8.5 * 11 / 1550.0031) * 89 * 0.035274;
            assert('Tri-fold weight uses flat area', m.weightOz, expectedWeight);

            // Thickness: cal * ply * bulge, bulge = 1.1 + (3 * 0.02) = 1.16
            var expectedThick = 0.0046 * 3 * 1.16;
            assert('Tri-fold thickness with bulge', m.itemThick, expectedThick);
        })();

        (function() {
            // Bi-fold self-mailer: 12 x 9, fold=2, foldAxis=w, McCoy 100# Gloss Cover
            var idx = stockIdx('Sappi McCoy 100# Gloss Cover');
            var c = makeComponent({ type: 'selfmailer', w: 12, h: 9, fold: '2', foldAxis: 'w', stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            assert('Bi-fold finW: 12/2', m.finW, 6);
            assert('Bi-fold finH unchanged', m.finH, 9);

            // Bulge for ply=2: 1.1 + (2 * 0.02) = 1.14
            var expectedThick = 0.0087 * 2 * 1.14;
            assert('Bi-fold thickness', m.itemThick, expectedThick);
        })();

        (function() {
            // Flat sheet (no fold): 8.5 x 3.5, fold=1, McCoy 80# Gloss Text
            var idx = stockIdx('Sappi McCoy 80# Gloss Text');
            var c = makeComponent({ type: 'sheet', w: 8.5, h: 3.5, fold: '1', stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            assert('Flat sheet finW unchanged', m.finW, 8.5);
            assert('Flat sheet finH unchanged', m.finH, 3.5);

            // ply=1, bulge=1.0 (no bulge for single ply)
            assert('Flat sheet thickness = caliper', m.itemThick, 0.0035 * 1 * 1.0);
        })();

        section('Calculations: Accordion');

        (function() {
            // Accordion 4-panel: 28 x 8.5, panels=4, foldAxis=w, McCoy 80# Gloss Text
            var idx = stockIdx('Sappi McCoy 80# Gloss Text');
            var c = makeComponent({ type: 'accordion', w: 28, h: 8.5, panels: 4, foldAxis: 'w', stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            assert('Accordion finW: 28/4', m.finW, 7);
            assert('Accordion finH unchanged', m.finH, 8.5);

            var expectedWeight = (28 * 8.5 / 1550.0031) * 118 * 0.035274;
            assert('Accordion weight uses flat area', m.weightOz, expectedWeight);

            // Bulge for ply=4: 1.1 + (4 * 0.02) = 1.18
            var expectedThick = 0.0035 * 4 * 1.18;
            assert('Accordion thickness', m.itemThick, expectedThick);
        })();

        section('Calculations: Custom Panel Mode');

        (function() {
            // Gate fold via custom panels: flat 17x11, finished 8.5x11, layers=4, McCoy 100# Gloss Cover
            var idx = stockIdx('Sappi McCoy 100# Gloss Cover');
            var c = makeComponent({
                type: 'selfmailer', w: 17, h: 11, stockIdx: idx,
                customPanels: true, flatWidth: 17, flatHeight: 11,
                finishedWidth: 8.5, finishedHeight: 11, layersAtFold: 4
            });
            var m = Calc.calculateComponentMetrics(c);

            assert('Custom panel finW = finishedWidth', m.finW, 8.5);
            assert('Custom panel finH = finishedHeight', m.finH, 11);

            // Weight uses flat area: 17 * 11
            var expectedWeight = (17 * 11 / 1550.0031) * 270 * 0.035274;
            assert('Custom panel weight uses flat area', m.weightOz, expectedWeight);

            // Thickness: cal * layers * bulge, bulge = 1.1 + (4 * 0.02) = 1.18
            var expectedThick = 0.0087 * 4 * 1.18;
            assert('Custom panel thickness uses layersAtFold', m.itemThick, expectedThick);
        })();

        section('Calculations: Booklet (self-cover)');

        (function() {
            // 8-page self-cover booklet: 8.5x11, panels=8, stitch, McCoy 80# Gloss Text
            var idx = stockIdx('Sappi McCoy 80# Gloss Text');
            var c = makeComponent({
                type: 'booklet', w: 8.5, h: 11, panels: 8, binding: 'stitch',
                stockIdx: idx, coverStockIdx: -1
            });
            var m = Calc.calculateComponentMetrics(c);

            // 8pp self-cover = 4pp body + 4pp cover sheet (2 press sheets total)
            var bodyArea = (8.5 * 11 * 2) * ((8 - 4) / 4);
            var bodyWeight = (bodyArea / 1550.0031) * 118 * 0.035274;
            var coverArea = 8.5 * 2 * 11;
            var coverWeight = (coverArea / 1550.0031) * 118 * 0.035274;
            assert('Booklet self-cover weight', m.weightOz, bodyWeight + coverWeight);

            // body leaves = (8-4)/2 = 2, cover leaves = 2
            var expectedThick = (0.0035 * 2 + 0.0035 * 2) * 1.25;
            assert('Booklet self-cover thickness (saddle)', m.itemThick, expectedThick);
        })();

        section('Calculations: Booklet (plus-cover)');

        (function() {
            // 12+4 page plus-cover: 8.5x11, panels=16, stitch
            var bodyIdx = stockIdx('Sappi McCoy 80# Gloss Text');
            var coverIdx = stockIdx('Sappi McCoy 100# Gloss Cover');
            var c = makeComponent({
                type: 'booklet', w: 8.5, h: 11, panels: 16, binding: 'stitch',
                stockIdx: bodyIdx, coverStockIdx: coverIdx
            });
            var m = Calc.calculateComponentMetrics(c);

            var bodyArea = (8.5 * 11 * 2) * (12 / 4);
            var bodyWeight = (bodyArea / 1550.0031) * 118 * 0.035274;
            var coverArea = 8.5 * 2 * 11;
            var coverWeight = (coverArea / 1550.0031) * 270 * 0.035274;
            assert('Booklet plus-cover weight', m.weightOz, bodyWeight + coverWeight);

            var expectedThick = (0.0035 * 6 + 0.0087 * 2) * 1.25;
            assert('Booklet plus-cover thickness (saddle)', m.itemThick, expectedThick);
        })();

        (function() {
            // Perfect bound booklet: 32+4 pages, paste binding
            var bodyIdx = stockIdx('Sappi McCoy 80# Gloss Text');
            var coverIdx = stockIdx('Sappi McCoy 100# Gloss Cover');
            var c = makeComponent({
                type: 'booklet', w: 8.5, h: 11, panels: 36, binding: 'paste',
                stockIdx: bodyIdx, coverStockIdx: coverIdx
            });
            var m = Calc.calculateComponentMetrics(c);

            var bodyThick = 0.0035 * (32 / 2);
            var coverThick = 0.0087 * 2;
            var expectedThick = (bodyThick + coverThick) * 1.05 + 0.015;
            assert('Booklet perfect bound thickness (with glue)', m.itemThick, expectedThick);
        })();

        section('Calculations: Card (default type)');

        (function() {
            // CR80 card: 3.375 x 2.125, 30mil PVC
            var idx = stockIdx('30mil PVC Card (CR80)');
            var c = makeComponent({ type: 'card', w: 3.375, h: 2.125, stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            var expectedWeight = (3.375 * 2.125 / 1550.0031) * 1100 * 0.035274;
            assert('Card weight', m.weightOz, expectedWeight);
            assert('Card thickness = caliper', m.itemThick, 0.0300);
        })();

        section('Calculations: Magnet Stocks (ground truth)');

        (function() {
            // 4x6 20-mil promo magnet: trade-verified ~28 g (~1.0 oz)
            var idx = stockIdx('20mil Magnet Sheet');
            var c = makeComponent({ type: 'card', w: 6, h: 4, stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            var expectedWeight = (6 * 4 / 1550.0031) * 1830 * 0.035274; // ≈ 0.9995 oz ≈ 28.3 g
            assert('20mil magnet 4x6 weight (~28 g trade check)', m.weightOz, expectedWeight);
            assert('20mil magnet thickness = caliper', m.itemThick, 0.0200);
        })();

        (function() {
            var idx = stockIdx('15mil Magnet Sheet');
            var c = makeComponent({ type: 'card', w: 6, h: 4, stockIdx: idx });
            var m = Calc.calculateComponentMetrics(c);

            var expectedWeight = (6 * 4 / 1550.0031) * 1370 * 0.035274;
            assert('15mil magnet 4x6 weight', m.weightOz, expectedWeight);
            assert('15mil magnet thickness = caliper', m.itemThick, 0.0150);
        })();

        section('Calculations: Coating Weight Addition');

        (function() {
            // Sheet with UV coating (+3.5%)
            var idx = stockIdx('Sappi McCoy 80# Gloss Text');
            var c = makeComponent({ type: 'sheet', w: 8.5, h: 11, fold: '1', stockIdx: idx, coating: 'uv' });
            var m = Calc.calculateComponentMetrics(c);

            var baseWeight = (8.5 * 11 / 1550.0031) * 118 * 0.035274;
            var expectedWeight = baseWeight * (1 + 0.035);
            assert('UV coating adds 3.5% to weight', m.weightOz, expectedWeight);
        })();

        section('Calculations: Manual Overrides');

        (function() {
            var idx = stockIdx('Sappi McCoy 80# Gloss Text');
            var c = makeComponent({ type: 'sheet', w: 8.5, h: 11, fold: '1', stockIdx: idx, manualWeight: 0.5, manualThick: 0.01 });
            var m = Calc.calculateComponentMetrics(c);

            assert('Manual weight override', m.weightOz, 0.5);
            assert('Manual thickness override', m.itemThick, 0.01);
        })();

        section('Calculations: Buffers and Seals');

        (function() {
            // Weight buffer: 5%
            assert('Weight buffer 5%', Calc.applyWeightBuffer(1.0, 5), 1.05);
            assert('Weight buffer 0%', Calc.applyWeightBuffer(1.0, 0), 1.0);

            // Thickness buffer
            var result = Calc.applyThicknessBuffer(0.02, 0.001, 5);
            assert('Thickness buffer 5%', result.thickness, 0.021);
            assert('Tolerance buffer 5%', result.toleranceSum, 0.00105);

            // Seals: 2 wafer tabs
            var sealResult = Calc.applySeals(0.02, 0.5, 'wafer', 2);
            assert('Seal thickness: 2 wafer', sealResult.thickness, 0.02 + 0.002 * 2);
            assert('Seal weight: 2 wafer', sealResult.weightOz, 0.5 + 0.003 * 2);

            // Seals: none
            var noSeal = Calc.applySeals(0.02, 0.5, 'none', 0);
            assert('No seal: thickness unchanged', noSeal.thickness, 0.02);
            assert('No seal: weight unchanged', noSeal.weightOz, 0.5);
        })();

        // =====================================================
        // CLASSIFICATION TESTS
        // =====================================================
        section('Classification: Letter Boundaries');

        (function() {
            // Standard letter
            var r = Postal.classifyPiece(9.5, 4.125, 0.01, true);
            assertString('Standard letter', r.pClass, 'Letter');
            assertString('Standard letter sub', r.pSub, 'Automation');

            // At letter height limit (exactly 6.125)
            r = Postal.classifyPiece(9.5, 6.125, 0.01, true);
            assertString('At height limit 6.125: still Letter', r.pClass, 'Letter');

            // Over letter height limit
            r = Postal.classifyPiece(9.5, 6.126, 0.01, true);
            assertString('Over height limit 6.126: Flat', r.pClass, 'Flat');

            // At letter width limit (exactly 11.5)
            r = Postal.classifyPiece(11.5, 4.125, 0.01, true);
            assertString('At width limit 11.5: still Letter', r.pClass, 'Letter');

            // Over letter width limit
            r = Postal.classifyPiece(11.501, 4.125, 0.01, true);
            assertString('Over width limit 11.501: Flat', r.pClass, 'Flat');

            // At thickness limit (exactly 0.25)
            r = Postal.classifyPiece(9.5, 4.125, 0.25, true);
            assertString('At thickness limit 0.25: still Letter', r.pClass, 'Letter');

            // Over thickness limit
            r = Postal.classifyPiece(9.5, 4.125, 0.251, true);
            assertString('Over thickness limit 0.251: Flat', r.pClass, 'Flat');
        })();

        section('Classification: Flat and Parcel');

        (function() {
            // Flat piece
            var r = Postal.classifyPiece(12, 9, 0.3, true);
            assertString('Large flat', r.pClass, 'Flat');

            // Over flat limits -> Parcel
            r = Postal.classifyPiece(16, 9, 0.3, true);
            assertString('Width > 15: Parcel', r.pClass, 'Parcel');

            r = Postal.classifyPiece(12, 13, 0.3, true);
            assertString('Height > 12: Parcel', r.pClass, 'Parcel');

            r = Postal.classifyPiece(12, 9, 0.76, true);
            assertString('Thickness > 0.75: Parcel', r.pClass, 'Parcel');
        })();

        section('Classification: Non-Mailable and Aspect Ratio');

        (function() {
            // Too small
            var r = Postal.classifyPiece(4, 3, 0.01, true);
            assertString('Too small: Non-Mailable', r.pClass, 'Non-Mailable');

            // Bad aspect ratio (too low)
            r = Postal.classifyPiece(6, 5, 0.01, true);
            assertString('Aspect ratio 1.2: Non-Machinable', r.pSub, 'Non-Machinable');
            assertString('Aspect ratio 1.2: still Letter class', r.pClass, 'Letter');

            // Bad aspect ratio (too high)
            r = Postal.classifyPiece(10, 3.5, 0.01, true);
            assertString('Aspect ratio 2.86: Non-Machinable', r.pSub, 'Non-Machinable');

            // Good aspect ratio
            r = Postal.classifyPiece(9.5, 4.125, 0.01, true);
            assertString('Aspect ratio 2.30: Automation', r.pSub, 'Automation');

            // No components
            r = Postal.classifyPiece(9.5, 4.125, 0.01, false);
            assertString('No components: dash', r.pClass, '—');
        })();

        section('Classification: Minimum Thickness (DMM two-tier)');

        (function() {
            assert('Floor 0.007 at exactly 6" x 4.25"', Postal.getMinimumThickness(6, 4.25), 0.007, 0.00001);
            assert('Floor 0.009 when length > 6"', Postal.getMinimumThickness(6.01, 4.25), 0.009, 0.00001);
            assert('Floor 0.009 when height > 4.25"', Postal.getMinimumThickness(6, 4.26), 0.009, 0.00001);

            // #10-size piece (9.5" long -> 0.009 floor)
            var r = Postal.classifyPiece(9.5, 4.125, 0.008, true);
            assertString('9.5x4.125 @ 0.008: Non-Mailable', r.pClass, 'Non-Mailable');
            assertString('9.5x4.125 @ 0.008: Too Thin', r.pSub, 'Too Thin');
            r = Postal.classifyPiece(9.5, 4.125, 0.009, true);
            assertString('9.5x4.125 @ exactly 0.009: Letter', r.pClass, 'Letter');

            // Small piece on the 0.007 floor
            r = Postal.classifyPiece(6, 4.25, 0.007, true);
            assertString('6x4.25 @ exactly 0.007: Letter', r.pClass, 'Letter');
            r = Postal.classifyPiece(6, 4.25, 0.0065, true);
            assertString('6x4.25 @ 0.0065: Too Thin', r.pSub, 'Too Thin');

            // Flat-size sheet too thin must be Non-Mailable, not Flat (ordering check)
            r = Postal.classifyPiece(12, 9, 0.005, true);
            assertString('12x9 @ 0.005: Non-Mailable, not Flat', r.pClass, 'Non-Mailable');

            // Too Small outranks Too Thin
            r = Postal.classifyPiece(4, 3, 0.001, true);
            assertString('Below min size: Too Small wins', r.pSub, 'Too Small');
        })();

        section('Postal Warnings: Boundaries & Minimums');

        (function() {
            function count(w, level, substr) {
                return w.filter(function(x) { return x.level === level && x.text.indexOf(substr) !== -1; }).length;
            }
            function warn(wOz, thick, W, H) {
                var cls = Postal.classifyPiece(W, H, thick, true);
                var ratio = Postal.calculateAspectRatio(W, H);
                return Postal.generatePostalWarnings(wOz, thick, W, H, ratio, cls, true);
            }

            // Ratio exactly 2.50: compliant -> amber at-limit, NO red
            var w = warn(1, 0.05, 10, 4);
            assert('Ratio 2.50: no red', count(w, 'red', 'Aspect ratio'), 0);
            assert('Ratio 2.50: at-limit amber', count(w, 'amber', 'at the 2.5 maximum'), 1);

            // Ratio above 2.50: red
            w = warn(1, 0.05, 10.2, 4);
            assert('Ratio 2.55: red fires', count(w, 'red', 'Aspect ratio'), 1);

            // Ratio exactly 1.30: compliant -> amber at-limit, NO red
            w = warn(1, 0.05, 6.5, 5);
            assert('Ratio 1.30: no red', count(w, 'red', 'Aspect ratio'), 0);
            assert('Ratio 1.30: at-limit amber', count(w, 'amber', 'at the 1.3 minimum'), 1);

            // Ratio below 1.30: red
            w = warn(1, 0.05, 6, 5);
            assert('Ratio 1.20: red fires', count(w, 'red', 'Aspect ratio'), 1);

            // Minimum thickness red
            w = warn(0.2, 0.005, 9.5, 4.125);
            assert('Sub-minimum thickness: red fires', count(w, 'red', 'below the DMM'), 1);
            w = warn(0.2, 0.010, 9.5, 4.125);
            assert('Compliant thickness: no min-thickness red', count(w, 'red', 'below the DMM'), 0);

            // Weight bands
            w = warn(3.4, 0.05, 9.5, 4.125);
            assert('3.4 oz: flat-pricing amber, corrected wording', count(w, 'amber', 'flat prices and preparation'), 1);
            w = warn(14, 0.3, 12, 9);
            assert('14 oz: MM-flats-only amber', count(w, 'amber', 'Marketing Mail flats only'), 1);
            w = warn(16.5, 0.3, 12, 9);
            assert('16.5 oz: parcel red', count(w, 'red', 'parcel rates apply'), 1);
        })();

        section('Classification: Postage Lookup');

        (function() {
            var r = Postal.lookupPostage('Letter', false, 0.5, true);
            assert('Letter postage: marketing', r.marketingRate, 0.355);
            assert('Letter postage: first-class 1oz', r.firstClassRate, 0.64);

            r = Postal.lookupPostage('Letter', false, 1.5, true);
            assert('Letter 1.5oz: first-class 2oz rate', r.firstClassRate, 0.93);

            r = Postal.lookupPostage('Flat', true, 2.0, true);
            assert('Flat postage: marketing', r.marketingRate, 0.56);
            assert('Flat postage: first-class', r.firstClassRate, 1.60);

            r = Postal.lookupPostage('Parcel', false, 15, true);
            assert('Parcel: no marketing rate', r.marketingRate, 0);
            assert('Parcel: no first-class rate', r.firstClassRate, 0);
        })();

        section('Classification: Weight Status');

        (function() {
            assertString('Weight 0.5oz', Postal.getWeightStatus(0.5, true), 'Machinable ≤1oz');
            assertString('Weight 2.0oz', Postal.getWeightStatus(2.0, true), 'Std Letter ≤3.5oz');
            assertString('Weight 5.0oz', Postal.getWeightStatus(5.0, true), 'Flat ≤13oz');
            assertString('Weight 15oz: MM flat territory', Postal.getWeightStatus(15.0, true), 'MM Flat only <16oz');
            assertString('Weight 16oz: Parcel', Postal.getWeightStatus(16.0, true), 'Parcel');
            assertString('No components', Postal.getWeightStatus(0, false), '—');
        })();

        section('Tray Capacity & EMM Trigger');

        (function() {
            // Standard #10 letter (9.5 x 4.125, 0.01" thick): MM trays, no EMM
            var t = Postal.calculateTrayCapacity(9.5, 4.125, 0.01, 1.0, 'Letter');
            assertString('Standard #10: mode letter', t.mode, 'letter');
            assertString('Standard #10: no EMM', t.emm, false);
            assert('Standard #10: 2-ft count 1785', t.tray2Count, 1785);   // floor(21.0/0.01*0.85)
            assert('Standard #10: 1-ft count 871', t.tray1Count, 871);     // floor(10.25/0.01*0.85)

            // 6x9 envelope package (9 x 6, height > 4.625): EMM required — THE defect case
            t = Postal.calculateTrayCapacity(9, 6, 0.02, 1.5, 'Letter');
            assertString('6x9 envelope: EMM required', t.emm, true);
            assert('6x9 envelope: 2-ft uses 21.75', t.tray2Count, 924);    // floor(21.75/0.02*0.85)
            assertString('6x9 envelope: 1-ft inapplicable', t.tray1Count, null);

            // Length trigger: 10.5" long letter, short height
            t = Postal.calculateTrayCapacity(10.5, 4.0, 0.01, 1.0, 'Letter');
            assertString('10.5 inch letter: EMM via length', t.emm, true);

            // Boundaries are inclusive for MM trays (strict > triggers EMM)
            t = Postal.calculateTrayCapacity(10, 4.625, 0.01, 1.0, 'Letter');
            assertString('Exactly 4.625 H and 10 L: MM tray, no EMM', t.emm, false);
            assertString('Exactly at boundary: 1-ft count present', t.tray1Count !== null, true);

            // Flat: letter-tray counts do not apply
            t = Postal.calculateTrayCapacity(12, 9, 0.05, 3.0, 'Flat');
            assertString('Flat: mode flat', t.mode, 'flat');
            assertString('Flat: no 2-ft count', t.tray2Count, null);
            assertString('Flat: no 1-ft count', t.tray1Count, null);

            // Non-Mailable and empty: mode none
            t = Postal.calculateTrayCapacity(4, 3, 0.01, 0.5, 'Non-Mailable');
            assertString('Non-Mailable: mode none', t.mode, 'none');
            t = Postal.calculateTrayCapacity(0, 0, 0, 0, '—');
            assertString('Empty assembly: mode none', t.mode, 'none');
        })();

        section('Dimension Driver Selection');

        (function() {
            // Largest-area envelope drives — not the last one in the list
            var d = Postal.selectDimensionDriver([
                { name: '9x12 Outer', type: 'envelope', finW: 12, finH: 9 },
                { name: '#9 BRE',     type: 'envelope', finW: 8.875, finH: 3.875 }
            ]);
            assert('Driver maxW = largest envelope', d.maxW, 12);
            assert('Driver maxH = largest envelope', d.maxH, 9);
            assertString('Driver name = outer envelope', d.driverName, '9x12 Outer');
            assertString('Driver flagged as envelope', d.driverIsEnvelope, true);

            // Envelope outranks a larger-area non-envelope insert
            var d2 = Postal.selectDimensionDriver([
                { name: 'Big Insert', type: 'insert',   finW: 11, finH: 8.5 },
                { name: '#10 Env',    type: 'envelope', finW: 9.5, finH: 4.125 }
            ]);
            assertString('Envelope drives over larger insert', d2.driverName, '#10 Env');

            // No envelope: largest-area component drives
            var d3 = Postal.selectDimensionDriver([
                { name: 'Small', type: 'insert', finW: 6, finH: 4 },
                { name: 'Large', type: 'sheet',  finW: 11, finH: 8.5 }
            ]);
            assertString('Largest component drives when no envelope', d3.driverName, 'Large');

            // Empty assembly
            var d4 = Postal.selectDimensionDriver([]);
            assertString('Empty assembly driver name', d4.driverName, '-');
        })();

        section('Envelope Fit Check');

        (function() {
            // Content larger than the envelope in both orientations → does not fit
            assertString('Oversize content does not fit',
                Postal.fitsInsideEnvelope(10, 5, 9.5, 4.125), false);
            // Normal tri-folded insert fits
            assertString('Normal insert fits',
                Postal.fitsInsideEnvelope(8.5, 3.67, 9.5, 4.125), true);
            // Fits only when rotated 90°
            assertString('Rotated content fits',
                Postal.fitsInsideEnvelope(4, 9, 9.5, 4.125), true);
        })();

        // =====================================================
        // COMPLIANCE TESTS
        // =====================================================
        section('Compliance: Flat/Postcard');

        (function() {
            var r = Compliance.evaluateSelfMailer({ foldType: '1', totalWeightOz: 0.5, sealType: 'none', sealQty: 0, hasOptionalElements: false });
            assertString('Postcard: N/A', r.status, 'na');
        })();

        section('Compliance: Bi-fold Tab Requirements');

        (function() {
            // Bi-fold under 1oz, no seals
            var r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'none', sealQty: 0, hasOptionalElements: false });
            assertString('Bi-fold no seals: fail', r.status, 'fail');
            assert('Bi-fold requires 2 tabs', r.requiredTabs, 2);
            assertString('Bi-fold tab size 1"', r.requiredSize, '1"');

            // Bi-fold under 1oz, 2 wafer tabs
            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false });
            assertString('Bi-fold 2 tabs: pass', r.status, 'pass');

            // Bi-fold under 1oz, 1 wafer tab (not enough)
            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 1, hasOptionalElements: false });
            assertString('Bi-fold 1 tab: fail', r.status, 'fail');

            // Bi-fold over 1oz
            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 1.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false });
            assertString('Bi-fold over 1oz: pass (2 tabs)', r.status, 'pass');
            assertString('Bi-fold over 1oz: size 1.5"', r.requiredSize, '1.5"');
        })();

        section('Compliance: Quarter-fold');

        (function() {
            // DMM 201.3.14 (current): quarter-fold > 1oz requires 2 tabs @ 1.5" (the 3-tab rule is for newsprint only, not modeled here).
            var r = Compliance.evaluateSelfMailer({ foldType: '4', totalWeightOz: 1.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false });
            assertString('Quarter-fold over 1oz, 2 tabs: pass', r.status, 'pass');
            assert('Quarter-fold requires 2 tabs', r.requiredTabs, 2);
            assertString('Quarter-fold over 1oz size 1.5"', r.requiredSize, '1.5"');

            r = Compliance.evaluateSelfMailer({ foldType: '4', totalWeightOz: 1.5, sealType: 'wafer', sealQty: 3, hasOptionalElements: false });
            assertString('Quarter-fold over 1oz, 3 tabs: pass', r.status, 'pass');
        })();

        section('Compliance: Optional Elements');

        (function() {
            // DMM 201.3.14 (current): optional elements require 2 tabs @ 1.5" (or glue), NOT +1 tab. Paper check omitted here — stockGsm not passed.
            var r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: true });
            assertString('Optional elements, 2 tabs: pass', r.status, 'pass');
            assert('Optional elements require 2 tabs', r.requiredTabs, 2);
            assertString('Optional elements size 1.5"', r.requiredSize, '1.5"');

            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 1, hasOptionalElements: true });
            assertString('Optional elements, 1 tab: fail', r.status, 'fail');
        })();

        section('Compliance: Perforated Tab Prohibition');

        (function() {
            // DMM 201.3.14: perforated tabs are prohibited regardless of count.
            var r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.8, sealType: 'perf_tab', sealQty: 2, hasOptionalElements: false });
            assertString('Perf tab bi-fold, 2 tabs: fail', r.status, 'fail');
            var hasProhibitionMsg = r.messages.some(function(m) { return m.indexOf('Perforated tabs are not permitted') !== -1; });
            assertString('Perf tab: prohibition message present', hasProhibitionMsg, true);
        })();

        section('Compliance: Glue Dot Counts');

        (function() {
            // Under 1oz: 3 spots required
            var r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.8, sealType: 'glue_dot', sealQty: 3, hasOptionalElements: false });
            assertString('Glue dot 0.8oz, 3 spots: pass', r.status, 'pass');

            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.8, sealType: 'glue_dot', sealQty: 2, hasOptionalElements: false });
            assertString('Glue dot 0.8oz, 2 spots: fail', r.status, 'fail');

            // Over 1oz: 4 spots required
            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 1.4, sealType: 'glue_dot', sealQty: 4, hasOptionalElements: false });
            assertString('Glue dot 1.4oz, 4 spots: pass', r.status, 'pass');

            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 1.4, sealType: 'glue_dot', sealQty: 3, hasOptionalElements: false });
            assertString('Glue dot 1.4oz, 3 spots: fail', r.status, 'fail');
        })();

        section('Compliance: FSM Size Gate (6" x 10.5")');

        (function() {
            // Letter-size finished piece exceeds FSM max even though it's within the letter maximum (11.5 x 6.125).
            var r = Compliance.evaluateSelfMailer({
                foldType: '3', totalWeightOz: 0.8, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                finishedW: 11, finishedH: 6.125
            });
            assertString('Finished 6.125x11 tri-fold: fail size gate', r.status, 'fail');
            var hasSizeMsg = r.messages.some(function(m) { return m.indexOf('folded self-mailer maximum') !== -1; });
            assertString('Size gate: fail message present', hasSizeMsg, true);

            // Boundary inclusive: exactly 6 x 10.5 passes gate
            r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 0.8, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                finishedW: 10.5, finishedH: 6
            });
            assertString('Finished 6x10.5 bi-fold: pass (boundary)', r.status, 'pass');

            // Well within: no size failure surfaces
            r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                finishedW: 8.5, finishedH: 5.5
            });
            assertString('Finished 5.5x8.5 bi-fold: pass', r.status, 'pass');
            var noSizeMsg = !r.messages.some(function(m) { return m.indexOf('folded self-mailer maximum') !== -1; });
            assertString('Small finished size: no size gate message', noSizeMsg, true);
        })();

        section('Compliance: Paper Basis-Weight Minimums');

        (function() {
            // <=1oz, no optional elements: 104 gsm min (70# book)
            var r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                stockGsm: 104
            });
            assertString('0.5oz, 104 gsm: pass', r.status, 'pass');

            r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                stockGsm: 90
            });
            assertString('0.5oz, 90 gsm: fail (below 104)', r.status, 'fail');

            // >1oz: 118 gsm min (80# book)
            r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 1.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                stockGsm: 118
            });
            assertString('1.5oz, 118 gsm: pass', r.status, 'pass');

            r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 1.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                stockGsm: 104
            });
            assertString('1.5oz, 104 gsm: fail (below 118)', r.status, 'fail');

            // Optional elements: 148 gsm min (100# book)
            r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: true,
                stockGsm: 148
            });
            assertString('Optional elements, 148 gsm: pass', r.status, 'pass');

            r = Compliance.evaluateSelfMailer({
                foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: true,
                stockGsm: 118
            });
            assertString('Optional elements, 118 gsm: fail (below 148)', r.status, 'fail');

            // No stockGsm: no paper message
            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false });
            var noPaperMsg = !r.messages.some(function(m) { return m.indexOf('gsm minimum') !== -1; });
            assertString('No stockGsm: no paper minimum message', noPaperMsg, true);
        })();

        section('Compliance: Specialty Fold Engagement');

        (function() {
            var r = Compliance.evaluateSelfMailer({
                foldType: 'specialty', totalWeightOz: 0.5, sealType: 'wafer', sealQty: 2, hasOptionalElements: false,
                finishedW: 8.5, finishedH: 5.5
            });
            assertString('Specialty fold, wafer x2: pass', r.status, 'pass');
            var hasMdaMsg = r.messages.some(function(m) { return m.indexOf('MDA') !== -1; });
            assertString('Specialty fold: MDA advisory present', hasMdaMsg, true);
        })();

        section('Compliance: Line Glue and Weight Limit');

        (function() {
            // Line glue is acceptable
            var r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'line_glue', sealQty: 2, hasOptionalElements: false });
            assertString('Line glue: pass', r.status, 'pass');

            // Line glue qty 1: caution
            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 0.5, sealType: 'line_glue', sealQty: 1, hasOptionalElements: false });
            assertString('Line glue qty 1: caution', r.status, 'caution');

            // Over 3oz: fail regardless
            r = Compliance.evaluateSelfMailer({ foldType: '2', totalWeightOz: 3.5, sealType: 'wafer', sealQty: 3, hasOptionalElements: false });
            assertString('Over 3oz: fail', r.status, 'fail');
        })();

        // =====================================================
        // RENDER RESULTS
        // =====================================================
        document.getElementById('version').innerHTML = '<div style="color: #64748b; margin-bottom: 1rem;">Testing against MailSpec data modules (' + STOCKS.length + ' stocks loaded)</div>';
        document.getElementById('output').innerHTML = output;

        var summaryClass = failCount === 0 ? 'summary all-pass' : 'summary has-fail';
        var summaryText = failCount === 0
            ? `All ${totalTests} tests passed.`
            : `${passCount}/${totalTests} passed, <span class="fail">${failCount} failed</span>.`;
        document.getElementById('summary').innerHTML = `<div class="${summaryClass}">${summaryText}</div>`;
    </script>
</body>
</html>
